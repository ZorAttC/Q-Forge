<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1160" viewBox="0 0 1900 1160" role="img" aria-labelledby="title desc">
  <title id="title">Q-Forge 系统架构</title>
  <desc id="desc">展示 SmolVLA 初始化、自标注轨迹收集、紧凑状态与动作构建、保守 Q 集成训练及三种策略改进路径的论文式架构图。</desc>
  <defs>
    <style>
      .font { font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Inter, Arial, sans-serif; }
      .title { font-size: 42px; font-weight: 750; fill: #172033; }
      .subtitle { font-size: 20px; fill: #5f6b7d; }
      .section { font-size: 17px; font-weight: 750; letter-spacing: 1.6px; }
      .card-title { font-size: 24px; font-weight: 750; fill: #172033; }
      .body { font-size: 18px; fill: #445066; }
      .small { font-size: 15px; fill: #667085; }
      .metric { font-size: 21px; font-weight: 750; }
      .badge { font-size: 17px; font-weight: 750; fill: #ffffff; }
      .arrow { fill: none; stroke: #7b8799; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #3d68c4; stroke-width: 3.5; marker-end: url(#arrowBlue); }
      .arrow-red { fill: none; stroke: #c43d4f; stroke-width: 3.5; marker-end: url(#arrowRed); }
    </style>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#14213d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#7b8799"/>
    </marker>
    <marker id="arrowBlue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#3d68c4"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 z" fill="#c43d4f"/>
    </marker>
  </defs>

  <rect width="1900" height="1160" fill="#f7f9fc"/>
  <rect x="35" y="30" width="1830" height="1100" rx="24" fill="#ffffff" stroke="#dce2eb" stroke-width="2"/>

  <g class="font">
    <text x="80" y="92" class="title">Q-Forge：面向流匹配 VLA 策略的自标注价值引导框架</text>
    <text x="80" y="130" class="subtitle">模拟器将局部策略扰动转化为动作敏感的价值监督；学习得到的评论家通过直接引导或残差蒸馏改进行为。</text>

    <rect x="80" y="166" width="1710" height="40" rx="10" fill="#edf3ff"/>
    <text x="100" y="192" class="section" fill="#315aa9">离线经验生成与评论家学习</text>

    <g filter="url(#shadow)">
      <rect x="80" y="235" width="330" height="300" rx="20" fill="#ffffff" stroke="#b7c7e7" stroke-width="2"/>
      <rect x="80" y="235" width="330" height="8" rx="4" fill="#5577bd"/>
      <circle cx="118" cy="280" r="20" fill="#5577bd"/>
      <text x="118" y="286" text-anchor="middle" class="badge">A</text>
      <text x="150" y="288" class="card-title">SmolVLA Base 策略</text>
      <rect x="110" y="320" width="270" height="58" rx="12" fill="#eef3fc"/>
      <text x="245" y="346" text-anchor="middle" class="metric" fill="#315aa9">20 条专家演示</text>
      <text x="245" y="367" text-anchor="middle" class="small">监督式策略初始化</text>
      <text x="112" y="417" class="body">冻结视觉语言主干</text>
      <text x="112" y="451" class="body">训练流匹配动作专家</text>
      <text x="112" y="485" class="body">5 步、7 维动作块</text>
      <text x="112" y="515" class="small">Base 闭环成功率：21/50（42%）</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="465" y="235" width="390" height="300" rx="20" fill="#ffffff" stroke="#b7c7e7" stroke-width="2"/>
      <rect x="465" y="235" width="390" height="8" rx="4" fill="#4d87a8"/>
      <circle cx="503" cy="280" r="20" fill="#4d87a8"/>
      <text x="503" y="286" text-anchor="middle" class="badge">B</text>
      <text x="535" y="288" class="card-title">自标注策略交互</text>
      <text x="497" y="333" class="body">50 个重置状态 × 6 条轨迹</text>
      <text x="497" y="367" class="body">局部机械臂动作扰动</text>
      <text x="497" y="401" class="small">σ = 0 / .01 / .03 / .03 / .05 / .05</text>
      <rect x="497" y="430" width="326" height="72" rx="12" fill="#edf7fa"/>
      <text x="660" y="458" text-anchor="middle" class="metric" fill="#28718f">模拟器自动监督</text>
      <text x="660" y="483" text-anchor="middle" class="small">奖励 + 终止成功；无需新增专家</text>
      <text x="497" y="522" class="small">36/50 个状态同时包含成功与失败结果</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="910" y="235" width="400" height="300" rx="20" fill="#ffffff" stroke="#c8bfdf" stroke-width="2"/>
      <rect x="910" y="235" width="400" height="8" rx="4" fill="#7867a8"/>
      <circle cx="948" cy="280" r="20" fill="#7867a8"/>
      <text x="948" y="286" text-anchor="middle" class="badge">C</text>
      <text x="980" y="288" class="card-title">紧凑离线数据集</text>
      <rect x="942" y="320" width="336" height="64" rx="12" fill="#f3f0f8"/>
      <text x="1110" y="348" text-anchor="middle" class="metric" fill="#665391">300 回合 / 60,505 个转移</text>
      <text x="1110" y="371" text-anchor="middle" class="small">回合边界安全的 H 步构建</text>
      <text x="942" y="422" class="body">主实验固定投影</text>
      <text x="1248" y="422" text-anchor="end" class="body" fill="#665391">z ∈ R^512</text>
      <text x="942" y="456" class="body">可选冻结 RLT</text>
      <text x="1248" y="456" text-anchor="end" class="body" fill="#665391">z ∈ R^2048</text>
      <text x="942" y="490" class="body">已执行动作块</text>
      <text x="1248" y="490" text-anchor="end" class="body" fill="#665391">a ∈ R^(5×7)</text>
      <text x="942" y="519" class="small">MC 回报 + H 步奖励 + 自举掩码</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1365" y="235" width="425" height="300" rx="20" fill="#ffffff" stroke="#e6c18c" stroke-width="2"/>
      <rect x="1365" y="235" width="425" height="8" rx="4" fill="#c98224"/>
      <circle cx="1403" cy="280" r="20" fill="#c98224"/>
      <text x="1403" y="286" text-anchor="middle" class="badge">D</text>
      <text x="1435" y="288" class="card-title">动作敏感 Q 集成</text>
      <text x="1397" y="334" class="body">5 个评论家；本体感知 8 → 256</text>
      <path d="M1400 365 H1755" stroke="#ead9bd" stroke-width="2"/>
      <text x="1397" y="399" class="body">1. 蒙特卡洛回归</text>
      <text x="1755" y="399" text-anchor="end" class="small">5,000 步</text>
      <text x="1397" y="433" class="body">2. H 步 TD + Cal-QL</text>
      <text x="1755" y="433" text-anchor="end" class="small">2,000 步</text>
      <rect x="1397" y="458" width="358" height="48" rx="10" fill="#fff6e9"/>
      <text x="1576" y="488" text-anchor="middle" class="metric" fill="#a66312">评论家门控：全部通过</text>
      <text x="1397" y="526" class="small">TD 损失 .00627；Q(成功) &gt; Q(失败)</text>
    </g>

    <path d="M410 385 H450" class="arrow-blue"/>
    <path d="M855 385 H895" class="arrow-blue"/>
    <path d="M1310 385 H1350" class="arrow-blue"/>
    <text x="430" y="366" text-anchor="middle" class="small">交互</text>
    <text x="875" y="366" text-anchor="middle" class="small">编码</text>
    <text x="1330" y="366" text-anchor="middle" class="small">拟合 Q</text>

    <rect x="80" y="584" width="1710" height="40" rx="10" fill="#fff0f2"/>
    <text x="100" y="610" class="section" fill="#a52d3d">策略改进与配对闭环评估</text>

    <g filter="url(#shadow)">
      <rect x="80" y="665" width="350" height="260" rx="20" fill="#ffffff" stroke="#b7c7e7" stroke-width="2"/>
      <text x="112" y="708" class="card-title">每次重规划的输入</text>
      <rect x="112" y="742" width="286" height="62" rx="12" fill="#eef3fc"/>
      <text x="255" y="768" text-anchor="middle" class="metric" fill="#315aa9">Base 动作块 a_ref</text>
      <text x="255" y="791" text-anchor="middle" class="small">由冻结 SmolVLA 采样</text>
      <rect x="112" y="827" width="286" height="62" rx="12" fill="#fff6e9"/>
      <text x="255" y="853" text-anchor="middle" class="metric" fill="#a66312">Q(z, p, a)</text>
      <text x="255" y="876" text-anchor="middle" class="small">集成均值 + 动作梯度</text>
    </g>

    <circle cx="505" cy="795" r="18" fill="#ffffff" stroke="#7b8799" stroke-width="3"/>
    <path d="M430 795 H487" class="arrow"/>
    <path d="M523 795 H585" class="arrow"/>
    <text x="505" y="801" text-anchor="middle" font-size="18" font-weight="700" fill="#596579">+</text>

    <g filter="url(#shadow)">
      <rect x="585" y="650" width="1205" height="105" rx="18" fill="#f8fafc" stroke="#cfd6e0" stroke-width="2"/>
      <rect x="585" y="650" width="10" height="105" rx="5" fill="#7b8799"/>
      <text x="620" y="690" class="card-title">Q 候选选择</text>
      <text x="620" y="724" class="body">采样 N=4 个完整动作块，执行集成均值 Q 最高的候选动作。</text>
      <rect x="1580" y="671" width="170" height="58" rx="12" fill="#edf0f4"/>
      <text x="1665" y="697" text-anchor="middle" class="metric" fill="#556174">36%（18/50）</text>
      <text x="1665" y="718" text-anchor="middle" class="small">相对 Base：−3</text>

      <rect x="585" y="775" width="1205" height="125" rx="18" fill="#fff7f8" stroke="#d95062" stroke-width="3"/>
      <rect x="585" y="775" width="10" height="125" rx="5" fill="#c43d4f"/>
      <text x="620" y="817" class="card-title" fill="#9e2737">约束 Q 引导（主要方法）</text>
      <text x="620" y="851" class="body">从 a_ref 出发进行投影、梯度裁剪的 Q 上升；使用信赖域与逐样本最优保留。</text>
      <text x="620" y="879" class="small">10 步 / 步长 .02 / 最大偏移 .05 / 优化 5×7 可执行动作前缀</text>
      <rect x="1540" y="797" width="210" height="78" rx="13" fill="#c43d4f"/>
      <text x="1645" y="829" text-anchor="middle" class="metric" fill="#ffffff">68%（34/50）</text>
      <text x="1645" y="854" text-anchor="middle" font-size="16" font-weight="700" fill="#ffe9ec">+13 状态；p=.0146</text>

      <rect x="585" y="920" width="1205" height="105" rx="18" fill="#f7f5fb" stroke="#b9acd2" stroke-width="2"/>
      <rect x="585" y="920" width="10" height="105" rx="5" fill="#7867a8"/>
      <text x="620" y="960" class="card-title">QVGM 残差蒸馏</text>
      <text x="620" y="994" class="body">蒸馏已分离梯度的评论家引导速度修正；部署时仅使用 SmolVLA。</text>
      <rect x="1580" y="941" width="170" height="58" rx="12" fill="#eeeaf6"/>
      <text x="1665" y="967" text-anchor="middle" class="metric" fill="#665391">64%（32/50）</text>
      <text x="1665" y="988" text-anchor="middle" class="small">+11；无回退</text>
    </g>

    <path d="M523 795 C555 795 545 702 570 702" class="arrow"/>
    <path d="M523 795 H570" class="arrow-red"/>
    <path d="M523 795 C555 795 545 972 570 972" class="arrow"/>

    <rect x="80" y="1065" width="1710" height="36" rx="9" fill="#172033"/>
    <text x="935" y="1089" text-anchor="middle" font-size="16" font-weight="650" fill="#ffffff">
      单张 AMD Radeon gfx1100 GPU：SFT、EGL 仿真、轨迹收集、评论家训练、引导评估与残差蒸馏
    </text>
  </g>
</svg>
